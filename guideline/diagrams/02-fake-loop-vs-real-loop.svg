<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-labelledby="t02 d02">
  <title id="t02">Fake loop and real loop, side by side</title>
  <desc id="d02">Two arrangements of the same generator. On the left, labelled FAKE LOOP, a dashed orange boundary encloses everything: a MODEL writes THE PAGE, then THE SAME MODEL is asked to grade it, and produces a pill reading 9 out of 10, drawn in the same orange fill as the model itself. An arrow returns from the grade to the model. Nothing enters the boundary and nothing leaves it. On the right, labelled REAL LOOP, the identical MODEL writes the identical PAGE, then the work crosses a hard vertical line marked off limits to the agent into a separate column. There a VERIFIER, running npm run check, is fed from above by THE CONTRACT, brief slash ACCEPTANCE dot md, its criteria written before the page. The verifier emits one of two chips, exit 0 in green or exit 1 in red, and the red one sends checks slash report dot md back around to the model. The left side is a closed circle in one colour; the right side is an open chain with an external authority in a different colour and a binary result.</desc>

  <defs>
    <marker id="ah-neutral" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#9CA3AF"/></marker>
    <marker id="ah-sodium" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#10B981"/></marker>
    <marker id="ah-coolant" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#F59E0B"/></marker>
    <marker id="ah-arc" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#FBBF24"/></marker>
    <marker id="ah-success" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#34D399"/></marker>
    <marker id="ah-danger" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#F87171"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="960" fill="#0A0A0A"/>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="60" y="78" font-size="40" font-weight="700" fill="#FFFFFF">Fake loop, real loop</text>
    <text x="60" y="118" font-size="24" fill="#9CA3AF">The same model writes the same page. What changes is who is allowed to say no.</text>

    <path d="M800 160 V920" stroke="#3F3F46" stroke-width="2" stroke-dasharray="10 10"/>

    <text x="425" y="202" font-size="32" font-weight="700" fill="#10B981" text-anchor="middle">FAKE LOOP</text>
    <text x="425" y="240" font-size="19" fill="#10B981" text-anchor="middle">no boundary anywhere</text>

    <rect x="150" y="250" width="550" height="610" rx="24" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="12 10"/>

    <rect x="275" y="290" width="300" height="100" rx="10" fill="#10B981"/>
    <text x="425" y="332" font-size="28" font-weight="700" fill="#0A0A0A" text-anchor="middle">MODEL</text>
    <text x="425" y="364" font-size="20" fill="#0A0A0A" text-anchor="middle">writes the page</text>

    <line x1="425" y1="392" x2="425" y2="438" stroke="#9CA3AF" stroke-width="4" marker-end="url(#ah-neutral)"/>

    <rect x="275" y="440" width="300" height="130" rx="8" fill="#161616" stroke="#10B981" stroke-width="3"/>
    <text x="425" y="496" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">THE PAGE</text>
    <text x="425" y="530" font-size="20" fill="#9CA3AF" text-anchor="middle">what the model produced</text>

    <line x1="425" y1="572" x2="425" y2="618" stroke="#9CA3AF" stroke-width="4" marker-end="url(#ah-neutral)"/>

    <rect x="275" y="620" width="300" height="100" rx="10" fill="#10B981"/>
    <text x="425" y="662" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">THE SAME MODEL</text>
    <text x="425" y="694" font-size="20" fill="#0A0A0A" text-anchor="middle">asked to grade it</text>

    <line x1="425" y1="722" x2="425" y2="766" stroke="#9CA3AF" stroke-width="4" marker-end="url(#ah-neutral)"/>

    <rect x="300" y="770" width="250" height="50" rx="25" fill="#10B981"/>
    <text x="425" y="804" font-size="26" font-weight="700" fill="#0A0A0A" text-anchor="middle">9 out of 10</text>

    <text x="425" y="852" font-size="20" fill="#9CA3AF" text-anchor="middle">a number with nothing behind it</text>

    <polyline points="298,795 200,795 200,340 269,340" fill="none" stroke="#10B981" stroke-width="4" marker-end="url(#ah-sodium)"/>

    <text x="425" y="900" font-size="21" fill="#10B981" text-anchor="middle">one model, one distribution, nothing external</text>

    <text x="1220" y="202" font-size="32" font-weight="700" fill="#F59E0B" text-anchor="middle">REAL LOOP</text>
    <text x="1220" y="240" font-size="19" fill="#F59E0B" text-anchor="middle">off limits to the agent</text>

    <path d="M1220 252 V700" stroke="#F59E0B" stroke-width="3"/>

    <rect x="880" y="290" width="300" height="100" rx="10" fill="#10B981"/>
    <text x="1030" y="332" font-size="28" font-weight="700" fill="#0A0A0A" text-anchor="middle">MODEL</text>
    <text x="1030" y="364" font-size="20" fill="#0A0A0A" text-anchor="middle">writes the page</text>

    <line x1="1030" y1="392" x2="1030" y2="438" stroke="#9CA3AF" stroke-width="4" marker-end="url(#ah-neutral)"/>

    <rect x="880" y="440" width="300" height="130" rx="8" fill="#161616" stroke="#10B981" stroke-width="3"/>
    <text x="1030" y="496" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">THE PAGE</text>
    <text x="1030" y="530" font-size="20" fill="#9CA3AF" text-anchor="middle">what the model produced</text>

    <line x1="1184" y1="505" x2="1256" y2="505" stroke="#9CA3AF" stroke-width="4" marker-end="url(#ah-neutral)"/>

    <rect x="1260" y="280" width="300" height="120" rx="8" fill="#1F1F1F" stroke="#FBBF24" stroke-width="3"/>
    <text x="1410" y="326" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">THE CONTRACT</text>
    <text x="1410" y="358" font-size="19" fill="#FBBF24" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">brief/ACCEPTANCE.md</text>
    <text x="1410" y="386" font-size="19" fill="#9CA3AF" text-anchor="middle">written before the page</text>

    <line x1="1410" y1="402" x2="1410" y2="436" stroke="#FBBF24" stroke-width="4" marker-end="url(#ah-arc)"/>

    <rect x="1260" y="440" width="300" height="140" fill="#161616" stroke="#F59E0B" stroke-width="4"/>
    <text x="1410" y="500" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">VERIFIER</text>
    <text x="1410" y="534" font-size="21" fill="#F59E0B" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">npm run check</text>
    <text x="1410" y="562" font-size="19" fill="#9CA3AF" text-anchor="middle">reads the built page</text>

    <line x1="1330" y1="582" x2="1330" y2="616" stroke="#34D399" stroke-width="4" marker-end="url(#ah-success)"/>
    <line x1="1490" y1="582" x2="1490" y2="616" stroke="#F87171" stroke-width="4" marker-end="url(#ah-danger)"/>

    <rect x="1260" y="620" width="140" height="52" rx="8" fill="#34D399"/>
    <text x="1330" y="655" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">exit 0</text>
    <rect x="1420" y="620" width="140" height="52" rx="8" fill="#F87171"/>
    <text x="1490" y="655" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">exit 1</text>

    <text x="1330" y="706" font-size="20" fill="#34D399" text-anchor="middle">it ships</text>

    <polyline points="1490,674 1490,800 860,800 860,340 876,340" fill="none" stroke="#F87171" stroke-width="4" marker-end="url(#ah-danger)"/>
    <text x="1175" y="832" font-size="21" fill="#9CA3AF" text-anchor="middle">checks/report.md, handed back verbatim</text>
  </g>
</svg>
