<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-labelledby="t02 d02">
  <title id="t02">Fake loop and real loop, side by side</title>
  <desc id="d02">Two arrangements on a near-black ground. On the left, FAKE LOOP, inside one dashed boundary labelled one context, nothing external: an AGENT writes THE PAGE, then THE SAME AGENT, with the same context, is asked to grade it, and returns 9 out of 10, a number with nothing behind it, which loops back to the agent. On the right, REAL LOOP: an AGENT writes THE PAGE, and the page goes to two checks at the same time. One is a VERIFIER, npm run check, a program that exits 0 or 1 and that the agent may not edit. The other is an ADVERSARIAL REVIEW: several agents in a fresh context, which never saw the build, attack the page, and a separate agent tries to refute every finding. Failures from the program and the findings that survive both go into one REPORT, which goes back to the agent. An empty report means the page ships.</desc>

  <defs>
    <marker id="b-neutral" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#9CA3AF"/></marker>
    <marker id="b-danger" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#F87171"/></marker>
    <marker id="b-success" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#34D399"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="960" fill="#0A0A0A"/>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="72" font-size="40" font-weight="700" fill="#FFFFFF">Fake loop, real loop</text>
    <text x="60" y="110" font-size="23" fill="#9CA3AF">An agent can check work. Not the same agent, in the same context, that did the work.</text>

    <line x1="800" y1="150" x2="800" y2="880" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="6 8"/>

    <!-- ── FAKE LOOP ─────────────────────────────────────────── -->
    <text x="400" y="170" font-size="26" font-weight="700" fill="#F87171" text-anchor="middle">FAKE LOOP</text>
    <rect x="150" y="190" width="500" height="580" rx="16" fill="none" stroke="#F87171" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="400" y="220" font-size="19" fill="#F87171" text-anchor="middle">one context, nothing external</text>

    <rect x="270" y="245" width="260" height="95" rx="10" fill="#10B981"/>
    <text x="400" y="286" font-size="25" font-weight="700" fill="#0A0A0A" text-anchor="middle">AGENT</text>
    <text x="400" y="316" font-size="19" fill="#0A0A0A" text-anchor="middle">writes the page</text>

    <line x1="400" y1="344" x2="400" y2="378" stroke="#9CA3AF" stroke-width="3" marker-end="url(#b-neutral)"/>

    <rect x="270" y="385" width="260" height="95" rx="10" fill="#161616" stroke="#10B981" stroke-width="3"/>
    <text x="400" y="426" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">THE PAGE</text>
    <text x="400" y="456" font-size="19" fill="#9CA3AF" text-anchor="middle">what the agent produced</text>

    <line x1="400" y1="484" x2="400" y2="518" stroke="#9CA3AF" stroke-width="3" marker-end="url(#b-neutral)"/>

    <rect x="230" y="525" width="340" height="110" rx="10" fill="#10B981"/>
    <text x="400" y="566" font-size="25" font-weight="700" fill="#0A0A0A" text-anchor="middle">THE SAME AGENT</text>
    <text x="400" y="596" font-size="19" fill="#0A0A0A" text-anchor="middle">same context,</text>
    <text x="400" y="620" font-size="19" fill="#0A0A0A" text-anchor="middle">asked to grade its work</text>

    <line x1="400" y1="639" x2="400" y2="673" stroke="#9CA3AF" stroke-width="3" marker-end="url(#b-neutral)"/>

    <rect x="300" y="680" width="200" height="56" rx="28" fill="#10B981"/>
    <text x="400" y="717" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">9 out of 10</text>

    <path d="M296 708 H200 V292 H262" fill="none" stroke="#10B981" stroke-width="3" marker-end="url(#b-success)"/>
    <text x="400" y="806" font-size="20" fill="#9CA3AF" text-anchor="middle">a number with nothing behind it</text>

    <!-- ── REAL LOOP ─────────────────────────────────────────── -->
    <text x="1195" y="170" font-size="26" font-weight="700" fill="#34D399" text-anchor="middle">REAL LOOP</text>

    <rect x="1065" y="195" width="260" height="95" rx="10" fill="#10B981"/>
    <text x="1195" y="236" font-size="25" font-weight="700" fill="#0A0A0A" text-anchor="middle">AGENT</text>
    <text x="1195" y="266" font-size="19" fill="#0A0A0A" text-anchor="middle">writes the page</text>

    <line x1="1195" y1="294" x2="1195" y2="318" stroke="#9CA3AF" stroke-width="3" marker-end="url(#b-neutral)"/>

    <rect x="1065" y="325" width="260" height="95" rx="10" fill="#161616" stroke="#10B981" stroke-width="3"/>
    <text x="1195" y="366" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">THE PAGE</text>
    <text x="1195" y="396" font-size="19" fill="#9CA3AF" text-anchor="middle">what the agent produced</text>

    <!-- fork: both checks at the same time -->
    <path d="M1195 424 V446 H1010 V472" fill="none" stroke="#9CA3AF" stroke-width="3" marker-end="url(#b-neutral)"/>
    <path d="M1195 446 H1380 V472" fill="none" stroke="#9CA3AF" stroke-width="3" marker-end="url(#b-neutral)"/>
    <text x="1195" y="468" font-size="17" fill="#9CA3AF" text-anchor="middle">in parallel</text>

    <rect x="840" y="480" width="340" height="160" rx="10" fill="#161616" stroke="#F59E0B" stroke-width="3"/>
    <text x="1010" y="520" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">VERIFIER</text>
    <text x="1010" y="552" font-size="20" fill="#F59E0B" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">npm run check</text>
    <text x="1010" y="584" font-size="18" fill="#9CA3AF" text-anchor="middle">a program: exit 0 or 1</text>
    <text x="1010" y="612" font-size="18" fill="#F59E0B" text-anchor="middle">the agent may not edit it</text>

    <rect x="1210" y="480" width="340" height="160" rx="10" fill="#161616" stroke="#34D399" stroke-width="3"/>
    <text x="1380" y="520" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">ADVERSARIAL REVIEW</text>
    <text x="1380" y="552" font-size="18" fill="#34D399" text-anchor="middle">fresh context, never saw the build</text>
    <text x="1380" y="584" font-size="18" fill="#9CA3AF" text-anchor="middle">several agents attack the page,</text>
    <text x="1380" y="612" font-size="18" fill="#9CA3AF" text-anchor="middle">another refutes each finding</text>

    <path d="M1010 644 V672 H1150 V692" fill="none" stroke="#F87171" stroke-width="3" marker-end="url(#b-danger)"/>
    <text x="1000" y="676" font-size="17" fill="#F87171" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">failures</text>
    <path d="M1380 644 V672 H1240 V692" fill="none" stroke="#F87171" stroke-width="3" marker-end="url(#b-danger)"/>
    <text x="1392" y="676" font-size="17" fill="#F87171" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">survivors</text>

    <rect x="1020" y="700" width="350" height="90" rx="10" fill="#161616" stroke="#F87171" stroke-width="3"/>
    <text x="1195" y="738" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">REPORT</text>
    <text x="1195" y="768" font-size="18" fill="#9CA3AF" text-anchor="middle">a file the agent reads next round</text>

    <path d="M1016 745 H820 V242 H1057" fill="none" stroke="#F87171" stroke-width="3" marker-end="url(#b-danger)"/>

    <rect x="1400" y="718" width="150" height="54" rx="27" fill="#34D399"/>
    <text x="1475" y="753" font-size="21" font-weight="700" fill="#0A0A0A" text-anchor="middle">ships</text>
    <line x1="1374" y1="745" x2="1394" y2="745" stroke="#34D399" stroke-width="3" marker-end="url(#b-success)"/>
    <text x="1475" y="806" font-size="18" fill="#34D399" text-anchor="middle">when it is empty</text>

    <text x="60" y="880" font-size="22" fill="#FFFFFF">The program decides what can be measured. The fresh-context review looks for what cannot.</text>
    <text x="60" y="914" font-size="22" fill="#9CA3AF">Neither replaces the other, and neither is the agent grading itself.</text>
  </g>
</svg>
