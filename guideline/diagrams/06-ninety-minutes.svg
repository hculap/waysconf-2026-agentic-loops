    <path d="M1629 336 v10 h141 v-10" fill="none" stroke="#9CA3AF" stroke-width="2"/>
    <text x="1770" y="376" font-size="18" fill="#9CA3AF" text-anchor="end">the buffer lives here</text>

    <text x="60" y="632" font-size="22" fill="#9CA3AF">Solid: you are typing. Dashed: the agent works alone while the talk goes on — reading the .fig, writing the checker, running the loop.</text>
    <text x="60" y="662" font-size="22" fill="#9CA3AF">Every prompt stands alone, so nobody stays stuck for more than one block. 08 is the whole run as one message, to take home.</text>
