<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" width="1800" height="700" role="img" aria-labelledby="t06 d06">
  <title id="t06">Ninety minutes: the shape of the session</title>
  <desc id="d06">A horizontal timeline from 0 to 90 minutes, 14:55 to 16:25, in two lanes. The upper lane, ON STAGE, holds the eight blocks of the deck: The case 0 to 8, Setup 8 to 15, Design in 15 to 25, Plan then build 25 to 40, The verifier 40 to 55, The loop and workflows 55 to 70, Ship it 70 to 82, Honesty 82 to 90. The lower lane, ON YOUR MACHINE, alternates solid blocks where you are typing with dashed blocks where the agent works alone while the talk continues: prompt 01 during setup; prompt 02 reading the .fig through Design in; sprint 1, reading what 02 found and building with 03; prompt 04 writing the checker through the verifier talk; sprint 2, the loop from prompt 05, through the loop and workflows talk; and sprint 3, deploying with 06. A row of markers shows where each prompt, 01 to 07, is pasted. The eight-minute buffer sits at the end.</desc>

  <defs>
    <pattern id="sprint2hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="16" height="16" fill="#10B981"/>
      <rect x="0" y="0" width="6" height="16" fill="#0A0A0A" opacity="0.10"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1800" height="700" fill="#0A0A0A"/>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="60" y="72" font-size="38" font-weight="700" fill="#FFFFFF">Ninety minutes</text>
    <text x="60" y="110" font-size="22" fill="#9CA3AF">14:55 to 16:25. Eight blocks, three sprints, and three stretches where the machine works while the talk continues.</text>

    <line x1="180" y1="176" x2="1770" y2="176" stroke="#9CA3AF" stroke-width="1.5"/>
    <g stroke="#9CA3AF" stroke-width="1.5">
