      <text x="534" y="456" font-size="18" fill="#D1D5DB" text-anchor="middle">reads the .fig</text>

      <rect x="624" y="380" width="261" height="110" rx="6" fill="#10B981"/>
      <text x="755" y="418" font-size="22" font-weight="700" fill="#0A0A0A" text-anchor="middle">SPRINT 1</text>
      <text x="755" y="446" font-size="18" fill="#0A0A0A" text-anchor="middle">read what 02 found,</text>
      <text x="755" y="472" font-size="18" fill="#0A0A0A" text-anchor="middle">then 03 builds</text>

      <rect x="889" y="380" width="261" height="110" rx="6" fill="#161616" stroke="#10B981" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="1020" y="418" font-size="22" font-weight="700" fill="#34D399" text-anchor="middle">04</text>
      <text x="1020" y="446" font-size="18" fill="#D1D5DB" text-anchor="middle">writes the checker</text>
      <text x="1020" y="472" font-size="18" fill="#D1D5DB" text-anchor="middle">while the talk goes on</text>

      <rect x="1154" y="380" width="261" height="110" rx="6" fill="#161616" stroke="#10B981" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="1285" y="418" font-size="22" font-weight="700" fill="#34D399" text-anchor="middle">SPRINT 2 · 05</text>
      <text x="1285" y="446" font-size="18" fill="#D1D5DB" text-anchor="middle">the loop runs alone</text>
      <text x="1285" y="472" font-size="18" fill="#D1D5DB" text-anchor="middle">while the talk goes on</text>

      <rect x="1419" y="380" width="208" height="110" rx="6" fill="#10B981"/>
      <text x="1523" y="418" font-size="22" font-weight="700" fill="#0A0A0A" text-anchor="middle">SPRINT 3</text>
      <text x="1523" y="446" font-size="18" fill="#0A0A0A" text-anchor="middle">06 deploys,</text>
      <text x="1523" y="472" font-size="18" fill="#0A0A0A" text-anchor="middle">URL on the board</text>
    </g>

    <text x="60" y="566" font-size="17" fill="#9CA3AF">prompts</text>
    <g stroke="#9CA3AF" stroke-width="2">
      <line x1="321" y1="494" x2="321" y2="546"/>
      <line x1="445" y1="494" x2="445" y2="546"/>
      <line x1="710" y1="494" x2="710" y2="546"/>
      <line x1="887" y1="494" x2="887" y2="546"/>
      <line x1="1152" y1="494" x2="1152" y2="546"/>
      <line x1="1417" y1="494" x2="1417" y2="546"/>
      <line x1="1540" y1="494" x2="1540" y2="546"/>
    </g>
    <g font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="321" y="570">01</text>
      <text x="445" y="570">02</text>
      <text x="710" y="570">03</text>
      <text x="887" y="570">04</text>
      <text x="1152" y="570">05</text>
      <text x="1417" y="570">06</text>
      <text x="1540" y="570">07</text>
