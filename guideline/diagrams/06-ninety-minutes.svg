      <line x1="357" y1="176" x2="357" y2="188"/>
      <line x1="533" y1="176" x2="533" y2="188"/>
      <line x1="710" y1="176" x2="710" y2="188"/>
      <line x1="887" y1="176" x2="887" y2="188"/>
      <line x1="1063" y1="176" x2="1063" y2="188"/>
      <line x1="1240" y1="176" x2="1240" y2="188"/>
      <line x1="1417" y1="176" x2="1417" y2="188"/>
      <line x1="1593" y1="176" x2="1593" y2="188"/>
      <line x1="1770" y1="176" x2="1770" y2="188"/>
    </g>
    <g font-size="20" fill="#9CA3AF" text-anchor="middle">
      <text x="180" y="160">0</text>
      <text x="357" y="160">10</text>
      <text x="533" y="160">20</text>
      <text x="710" y="160">30</text>
      <text x="887" y="160">40</text>
      <text x="1063" y="160">50</text>
      <text x="1240" y="160">60</text>
      <text x="1417" y="160">70</text>
      <text x="1593" y="160">80</text>
      <text x="1782" y="160" text-anchor="end">90 min</text>
    </g>

    <text x="60" y="248" font-size="18" font-weight="700" fill="#FFFFFF">ON STAGE</text>
    <text x="60" y="272" font-size="17" fill="#9CA3AF">the room</text>

    <text x="60" y="412" font-size="18" font-weight="700" fill="#FFFFFF">ON YOUR</text>
    <text x="60" y="434" font-size="18" font-weight="700" fill="#FFFFFF">MACHINE</text>
    <text x="60" y="458" font-size="17" fill="#9CA3AF">your screen</text>

    <g>
      <rect x="180" y="210" width="141" height="110" rx="6" fill="#161616" stroke="#9CA3AF" stroke-width="2"/>
      <text x="250" y="272" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">The case</text>

      <rect x="321" y="210" width="124" height="110" rx="6" fill="#161616" stroke="#9CA3AF" stroke-width="2"/>
      <text x="383" y="272" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Setup</text>

      <rect x="445" y="210" width="177" height="110" rx="6" fill="#161616" stroke="#9CA3AF" stroke-width="2"/>
      <text x="533" y="272" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Design in</text>

      <rect x="622" y="210" width="265" height="110" rx="6" fill="#161616" stroke="#9CA3AF" stroke-width="2"/>
      <text x="754" y="264" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Plan, then build</text>
      <text x="754" y="292" font-size="18" fill="#9CA3AF" text-anchor="middle">then on the floor</text>

      <rect x="887" y="210" width="265" height="110" rx="6" fill="#161616" stroke="#9CA3AF" stroke-width="2"/>
      <text x="1019" y="264" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">The verifier</text>
      <text x="1019" y="292" font-size="18" fill="#9CA3AF" text-anchor="middle">live contrast repair</text>

      <rect x="1152" y="210" width="265" height="110" rx="6" fill="#161616" stroke="#9CA3AF" stroke-width="2"/>
      <text x="1284" y="264" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">The loop and</text>
      <text x="1284" y="292" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">workflows</text>

      <rect x="1417" y="210" width="212" height="110" rx="6" fill="#161616" stroke="#9CA3AF" stroke-width="2"/>
