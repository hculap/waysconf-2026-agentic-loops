<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t07 d07">
  <title id="t07">Two shapes: a loop and a workflow</title>
  <desc id="d07">On the left, THE LOOP: PLAN, a hypothesis from the report, leads to IMPLEMENT, generate or fix, which leads to VERIFY, npm run check. Exit 0 leads to DONE; exit 1 sends the report back to PLAN. You define the exit condition; prompt 05, or /goal in Claude Code. On the right, THE WORKFLOW of prompt 08: seven phases in order, START, LOOK, ARM, BUILD, REPAIR, SHIP, ATTACK, each joined to the next by a bar naming what must be true first. LOOK builds a decoder and writes the design data, and waits for your answer; ARM writes the check before the page exists, so it fails; BUILD fans out to one agent per section and merges them in order; REPAIR runs the loop on the left; ATTACK sends the page to several reviewers with a fresh context, and every finding to a refuter. The two nest: phase 05 of the workflow is the loop.</desc>
  <defs>
    <marker id="m-n" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="16" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#9CA3AF"/></marker>
    <marker id="m-s" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="16" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#34D399"/></marker>
    <marker id="m-r" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="16" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#F87171"/></marker>
    <marker id="m-a" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="16" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#F59E0B"/></marker>
    <marker id="m-g" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="16" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#10B981"/></marker>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" fill="#0A0A0A"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <text x="60" y="72" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start">Two shapes</text>
  <text x="60" y="110" font-size="22" font-weight="400" fill="#9CA3AF" text-anchor="start">A loop repeats until a condition holds. A workflow runs phases in order, and a phase can branch.</text>
  <line x1="780" y1="140" x2="780" y2="900" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="80" y="170" font-size="22" font-weight="700" fill="#34D399" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">THE LOOP</text>
  <text x="80" y="198" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">repeat until a condition holds</text>
  <rect x="160" y="240" width="300" height="90" rx="8" fill="#161616" stroke="#10B981" stroke-width="3"/>
  <text x="310" y="280" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">PLAN</text>
  <text x="310" y="310" font-size="17" font-weight="400" fill="#9CA3AF" text-anchor="middle">a hypothesis from the report</text>
  <path d="M310 334 V368" fill="none" stroke="#9CA3AF" stroke-width="3" marker-end="url(#m-n)"/>
  <rect x="160" y="375" width="300" height="90" rx="8" fill="#161616" stroke="#10B981" stroke-width="3"/>
  <text x="310" y="415" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">IMPLEMENT</text>
  <text x="310" y="445" font-size="17" font-weight="400" fill="#9CA3AF" text-anchor="middle">generate, or fix</text>
  <path d="M310 469 V503" fill="none" stroke="#9CA3AF" stroke-width="3" marker-end="url(#m-n)"/>
  <polygon points="160,590 310,510 460,590 310,670" fill="#161616" stroke="#F59E0B" stroke-width="3"/>
  <text x="310" y="585" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">VERIFY</text>
  <text x="310" y="614" font-size="17" font-weight="400" fill="#F59E0B" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">npm run check</text>
  <path d="M464 590 H572" fill="none" stroke="#34D399" stroke-width="3" marker-end="url(#m-s)"/>
  <text x="518" y="576" font-size="17" font-weight="400" fill="#34D399" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">exit 0</text>
  <rect x="580" y="555" width="150" height="70" rx="8" fill="#34D399" stroke="#34D399" stroke-width="3"/>
  <text x="655" y="598" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">DONE</text>
  <path d="M156 590 H100 V285 H152" fill="none" stroke="#F87171" stroke-width="3" marker-end="url(#m-r)"/>
  <text x="88" y="440" font-size="16" font-weight="400" fill="#F87171" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" transform="rotate(-90 88 440)">exit 1: the report goes back</text>
  <rect x="80" y="720" width="650" height="130" rx="8" fill="#161616" stroke="#2E2E2E" stroke-width="2"/>
  <text x="104" y="758" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start">You define the exit condition.</text>
  <text x="104" y="790" font-size="18" font-weight="400" fill="#9CA3AF" text-anchor="start">Check written first. Then plan, implement, verify, until exit 0.</text>
  <text x="104" y="826" font-size="16" font-weight="400" fill="#F59E0B" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prompt 05 · /goal npm run check exits 0</text>
  <text x="820" y="170" font-size="22" font-weight="700" fill="#F59E0B" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">THE WORKFLOW</text>
  <text x="820" y="198" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">phases in order, a bar between each</text>
  <rect x="820" y="222" width="330" height="62" rx="8" fill="#161616" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="838" y="260" font-size="14" font-weight="400" fill="#F59E0B" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PHASE 01</text>
  <text x="938" y="252" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">START</text>
  <text x="938" y="274" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">project and dev server</text>
  <path d="M880 286 V310" fill="none" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#m-n)"/>
  <text x="894" y="306" font-size="14" font-weight="400" fill="#34D399" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">server runs</text>
  <rect x="820" y="316" width="330" height="62" rx="8" fill="#161616" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="838" y="354" font-size="14" font-weight="400" fill="#F59E0B" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PHASE 02</text>
  <text x="938" y="346" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">LOOK</text>
  <text x="938" y="368" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">build the decoder, write data</text>
  <path d="M880 380 V404" fill="none" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#m-n)"/>
  <text x="894" y="400" font-size="14" font-weight="400" fill="#34D399" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data written, you answered</text>
  <rect x="820" y="410" width="330" height="62" rx="8" fill="#161616" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="838" y="448" font-size="14" font-weight="400" fill="#F59E0B" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PHASE 03</text>
  <text x="938" y="440" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">ARM</text>
  <text x="938" y="462" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">write the check first</text>
  <path d="M880 474 V498" fill="none" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#m-n)"/>
  <text x="894" y="494" font-size="14" font-weight="400" fill="#34D399" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">check runs and fails</text>
  <rect x="820" y="504" width="330" height="62" rx="8" fill="#161616" stroke="#10B981" stroke-width="3"/>
  <text x="838" y="542" font-size="14" font-weight="400" fill="#F59E0B" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PHASE 04</text>
  <text x="938" y="534" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">BUILD</text>
  <text x="938" y="556" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">the whole page</text>
  <path d="M880 568 V592" fill="none" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#m-n)"/>
  <text x="894" y="588" font-size="14" font-weight="400" fill="#34D399" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">it builds</text>
  <rect x="820" y="598" width="330" height="62" rx="8" fill="#161616" stroke="#10B981" stroke-width="3"/>
  <text x="838" y="636" font-size="14" font-weight="400" fill="#F59E0B" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PHASE 05</text>
  <text x="938" y="628" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">REPAIR</text>
  <text x="938" y="650" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">the loop, until exit 0</text>
  <path d="M880 662 V686" fill="none" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#m-n)"/>
  <text x="894" y="682" font-size="14" font-weight="400" fill="#34D399" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">check exits 0</text>
  <rect x="820" y="692" width="330" height="62" rx="8" fill="#161616" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="838" y="730" font-size="14" font-weight="400" fill="#F59E0B" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PHASE 06</text>
  <text x="938" y="722" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">SHIP</text>
  <text x="938" y="744" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">deploy, check the live URL</text>
  <path d="M880 756 V780" fill="none" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#m-n)"/>
  <text x="894" y="776" font-size="14" font-weight="400" fill="#34D399" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">live check passes</text>
  <rect x="820" y="786" width="330" height="62" rx="8" fill="#161616" stroke="#10B981" stroke-width="3"/>
  <text x="838" y="824" font-size="14" font-weight="400" fill="#F59E0B" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PHASE 07</text>
  <text x="938" y="816" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">ATTACK</text>
  <text x="938" y="838" font-size="15" font-weight="400" fill="#9CA3AF" text-anchor="start">review, fix, deploy again</text>
