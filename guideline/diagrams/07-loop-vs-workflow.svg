  <text x="1344" y="531" font-size="15" font-weight="400" fill="#D1D5DB" text-anchor="start">one agent per section,</text>
  <text x="1344" y="553" font-size="15" font-weight="400" fill="#D1D5DB" text-anchor="start">merged in order</text>
  <path d="M1232 621 A 24 24 0 1 0 1218 649" fill="none" stroke="#10B981" stroke-width="3" marker-end="url(#m-g)"/>
  <text x="1254" y="627" font-size="15" font-weight="400" fill="#D1D5DB" text-anchor="start">plan, implement, verify</text>
  <text x="1254" y="649" font-size="15" font-weight="400" fill="#D1D5DB" text-anchor="start">the loop on the left</text>
  <path d="M1154 817 L1248 787" fill="none" stroke="#9CA3AF" stroke-width="2"/>
