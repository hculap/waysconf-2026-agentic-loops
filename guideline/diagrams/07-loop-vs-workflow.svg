  <text x="1350" y="813" font-size="15" font-weight="400" fill="#D1D5DB" text-anchor="start">reviewers, fresh context,</text>
  <text x="1350" y="835" font-size="15" font-weight="400" fill="#D1D5DB" text-anchor="start">each finding refuted</text>
  <rect x="820" y="850" width="700" height="0" rx="8" fill="#161616" stroke="none" stroke-width="0"/>
  <text x="820" y="888" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start">You define the phases, what branches inside them, and the bar between.</text>
  <text x="820" y="916" font-size="16" font-weight="400" fill="#F59E0B" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prompt 08</text>
  <text x="60" y="966" font-size="20" font-weight="400" fill="#D1D5DB" text-anchor="start">They nest: phase 05 of the workflow is the loop. Both are written as instructions, not code.</text>
