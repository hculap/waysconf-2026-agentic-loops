<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 1120" width="1980" height="1120" role="img" aria-labelledby="t d">
  <title id="t">Six workflow patterns</title>
  <desc id="d">1. Classify and act: A task goes to a classifier, which sends it to exactly one of three specialised agents. The chosen path is highlighted; the other two stay grey. 2. Fan out and synthesize: A task is split into four parts handled by parallel agents; their results meet at a bar and are merged into one result. 3. Adversarial verification: One worker produces a result; three independent verifiers with fresh context each try to break it and send findings back. 4. Generate and filter: Three generators produce six ideas; a filter with a rubric and deduplication keeps the best two and discards the rest. 5. Tournament: Four attempts are compared in pairs by two judges; the two winners meet a final judge, which picks one winner. 6. Loop until done: An agent runs, then a check asks whether there are new findings. If yes, another round starts; if no, the loop ends.</desc>
