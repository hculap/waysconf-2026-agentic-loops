name: gates

# The same gates the agent runs locally, run again here on every push.
# This exists to make one point on stage: the verifier is not a thing that lives
# inside the agent's head, and it does not go away when the agent stops looking.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run every gate
        run: npm run check

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            checks/report.md
            checks/report.json
            checks/.diff/
          retention-days: 14
          if-no-files-found: ignore
