<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000" role="img" aria-labelledby="t05 d05">
  <title id="t05">A dynamic workflow: one finder per lens, three refuters per finding, a majority filter</title>
  <desc id="d05">A fan-out reading left to right on a near-black ground. THE PAGE, as rendered, together with docs slash CANON dot md, feeds one finder per lens: design, looking at spacing and rhythm; a11y, looking at what axe cannot see; and copy, looking at tone and drift. Three of the six lenses are drawn, and one round of up to six. The lenses return different numbers of candidate findings, three, four and two, each one a citation such as dot ticket-card, open square bracket role equals tab, or CONTENT dot md colon 412. Every candidate is then judged by the same three refuters, shown as a matrix of green chips reading stands and red chips reading refuted, one row per finding. A vertical majority filter lets through only the findings where two of three refuters said stands: five of the nine survive and continue, each at its own height, into a tall report column, checks slash adversarial-report dot md, which lists the surviving claim and its citation. Text beneath records that nothing here runs in lockstep, that a lens returning two findings does not hold up a lens returning four, that every claim must cite a selector or a file and line or it is discarded unread, and that nothing on this page sets pass or fail.</desc>

