    <text x="60" y="812" font-size="24" font-weight="700" fill="#F2F4F7">Nothing here runs in lockstep.</text>
    <text x="60" y="850" font-size="22" fill="#A7AEBB">Each candidate goes to three refuters whose only instruction is to argue that it is wrong, and reaches the filter when its own</text>
    <text x="60" y="880" font-size="22" fill="#A7AEBB">panel finishes. A lens that returns two findings does not hold up a lens that returns four.</text>
    <text x="60" y="922" font-size="22" fill="#2FE6D6">The filter is arithmetic: two of three must stand. Every claim cites a selector or a file and line, or it is discarded unread.</text>
    <text x="60" y="956" font-size="22" fill="#2FE6D6">Nothing on this page sets pass or fail. It opens items for a person to triage.</text>
