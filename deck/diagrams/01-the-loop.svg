<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t01 d01">
  <title id="t01">The loop: plan, implement, verify, repeated until the check passes, then deploy</title>
  <desc id="d01">A cycle in three steps on a near-black ground. Along the top, left to right: PLAN, where the agent states a hypothesis about what to change and why; IMPLEMENT, where it writes the code, generating it the first time and fixing it every time after; VERIFY, which runs npm run check, a program driving a real browser. From VERIFY an arrow marked exit 0 leads right to DEPLOY, the only way out. An arrow marked exit 1 leads down to a document, report.md, holding one failure: what failed, where, what the design expects and what the page has. From that document an arrow runs left and up into PLAN, labelled the next hypothesis starts from the report. The way back carries a file written by a program, not the model's opinion of its own work.</desc>

  <defs>
    <marker id="ah-neutral" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#9CA3AF"/></marker>
    <marker id="ah-amber" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#F59E0B"/></marker>
    <marker id="ah-success" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#34D399"/></marker>
    <marker id="ah-danger" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#F87171"/></marker>
    <marker id="ah-emerald" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="18" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#10B981"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#0A0A0A"/>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="60" y="78" font-size="40" font-weight="700" fill="#FFFFFF">The loop</text>
    <text x="60" y="118" font-size="24" fill="#9CA3AF">Plan, implement, verify. Repeat until the check passes. The check is a program.</text>

    <!-- PLAN -->
    <rect x="80" y="220" width="320" height="160" rx="10" fill="#161616" stroke="#10B981" stroke-width="4"/>
    <text x="240" y="276" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">PLAN</text>
    <text x="240" y="312" font-size="21" fill="#9CA3AF" text-anchor="middle">a hypothesis:</text>
    <text x="240" y="340" font-size="21" fill="#9CA3AF" text-anchor="middle">what to change, and why</text>

    <!-- IMPLEMENT -->
    <rect x="500" y="220" width="320" height="160" rx="10" fill="#161616" stroke="#10B981" stroke-width="4"/>
    <text x="660" y="276" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">IMPLEMENT</text>
    <text x="660" y="312" font-size="21" fill="#9CA3AF" text-anchor="middle">generate the first time,</text>
    <text x="660" y="340" font-size="21" fill="#9CA3AF" text-anchor="middle">fix every time after</text>

    <!-- VERIFY -->
    <rect x="920" y="220" width="320" height="160" rx="10" fill="#161616" stroke="#F59E0B" stroke-width="4"/>
    <text x="1080" y="276" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">VERIFY</text>
    <text x="1080" y="312" font-size="21" fill="#F59E0B" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">npm run check</text>
    <text x="1080" y="340" font-size="21" fill="#9CA3AF" text-anchor="middle">a program, real browser</text>

    <!-- DEPLOY -->
    <rect x="1340" y="220" width="200" height="160" rx="10" fill="#34D399"/>
    <text x="1440" y="286" font-size="28" font-weight="700" fill="#0A0A0A" text-anchor="middle">DEPLOY</text>
    <text x="1440" y="322" font-size="19" fill="#0A0A0A" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">netlify</text>
    <text x="1440" y="348" font-size="19" fill="#0A0A0A" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">deploy</text>

    <!-- forward arrows -->
    <line x1="408" y1="300" x2="492" y2="300" stroke="#10B981" stroke-width="4" marker-end="url(#ah-emerald)"/>
    <line x1="828" y1="300" x2="912" y2="300" stroke="#9CA3AF" stroke-width="4" marker-end="url(#ah-neutral)"/>
    <line x1="1248" y1="300" x2="1332" y2="300" stroke="#34D399" stroke-width="4" marker-end="url(#ah-success)"/>
    <text x="1290" y="274" font-size="22" font-weight="600" fill="#34D399" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">exit 0</text>

    <!-- exit 1 down to the report -->
    <line x1="1080" y1="388" x2="1080" y2="482" stroke="#F87171" stroke-width="4" marker-end="url(#ah-danger)"/>
    <text x="1104" y="444" font-size="22" font-weight="600" fill="#F87171" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">exit 1</text>

    <!-- report.md -->
    <rect x="780" y="490" width="600" height="250" rx="8" fill="#161616" stroke="#9CA3AF" stroke-width="3"/>
    <rect x="782" y="492" width="596" height="50" fill="#1F1F1F"/>
    <path d="M780 542 H1380" stroke="#9CA3AF" stroke-width="2"/>
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="802" y="526" font-size="24" fill="#FFFFFF">report.md</text>
      <text x="1358" y="526" font-size="20" fill="#F87171" text-anchor="end">1 failing</text>
      <text x="802" y="584" font-size="20" fill="#F87171">colour not in the design</text>
      <text x="802" y="620" font-size="20" fill="#9CA3AF">where     .card__genre</text>
      <text x="802" y="652" font-size="20" fill="#9CA3AF">expected  text/secondary</text>
      <text x="802" y="684" font-size="20" fill="#9CA3AF">actual    #6B7280, 4.07:1</text>
      <text x="802" y="716" font-size="20" fill="#9CA3AF">minimum   4.5:1</text>
    </g>

    <!-- back to PLAN -->
    <path d="M772 615 H240 V388" fill="none" stroke="#9CA3AF" stroke-width="4" marker-end="url(#ah-neutral)"/>
    <text x="500" y="592" font-size="21" fill="#9CA3AF" text-anchor="middle">the next hypothesis</text>
    <text x="500" y="652" font-size="21" fill="#9CA3AF" text-anchor="middle">starts from the report</text>

    <text x="60" y="842" font-size="24" fill="#FFFFFF">The way back carries a file. Nothing on it asks the model whether the work is good.</text>
  </g>
</svg>
